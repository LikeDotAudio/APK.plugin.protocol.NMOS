[package]
workspace = "../../APK:plugins:Build/SRC"
name = "apkaudio-nmos"
version = "0.1.0"
edition.workspace = true

[dependencies]
# The container entry point in src/bin/apk-nmos.rs (PLAN-3316.01), and the crate
# it runs beside: NMOS_CONTROL's IS-04 registry agent is the second depth of the
# same finding, so audit §10.2 groups the two into one `nmos` container.
apk-plugin-runner = { path = "../../APK:plugins:Build/SRC/RUNNER" }
apkaudio-nmos-control = { path = "../../APK:plugin:NMOS_CONTROL/SRC" }
apkaudio-contracts = { path = "../../APK:BareMetal/SRC/contracts/rust" }
mdns-sd = "0.20"
rumqttc = "0.24"

# The MAC a SLAAC address was built from, and who IEEE gave that block to.
apkaudio-maclookup = { path = "../../APK:lib:MAC_LOOKUP/SRC" }
