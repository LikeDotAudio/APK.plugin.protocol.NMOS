# PLUGIN.NMOS — NMOS — the mDNS browse agent, one container.
# The IS-04 registry agent that used to share this container is its own stack,
# PLUGIN.NMOS_CONTROL: the two share nothing in memory, only the bus table.
#     COMPOSE_PROFILES=discovery docker compose -f 'PODS/POD.THICK/PLUGINS/PLUGIN.NMOS/Docker/docker-compose.yml' up -d --build
# Normally started with the other plugins, by node role (see discovery):
#     COMPOSE_PROFILES=discovery,l2 docker compose -f 'PODS/POD.THICK/DISCOVERY.Engine/Docker/docker-compose.yml' up -d
# The image, the capability floor, the broker variables and the healthcheck are
# the base service in DISCOVERY.Engine/Docker/plugin-base.yml; this file says
# only what is THIS plugin's. No bind mounts, so no `bind:` sub-key to carry.

# ONE PROJECT WITH THE REST (`apk-audio`), so the plugins clump with the node.
name: apk-audio

services:
  nmos:
    extends:
      file: "../../../DISCOVERY.Engine/Docker/plugin-base.yml"
      service: plugin-host
    container_name: Plugin-NMOS
    command: ["apk-nmos"]
    profiles: [discovery]

volumes:
  # LOGGER STORAGE — owned by DATABASE.volume.Log-STORAGE, which binds it onto
  # Documentation/LOGS and is up first in the pod. NOT `external:` (PLAN-3399.01),
  # so this file's own `up` also works on a clean host: compose uses the volume
  # if it exists and makes a plain one if it does not.
  apk-audio-logs:
    name: apk-audio-logs
  mac-lookup-cache:
    name: apk-audio-mac-lookup-cache
