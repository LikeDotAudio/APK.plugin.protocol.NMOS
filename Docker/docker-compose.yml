# PLUGIN.NMOS — NMOS — the mDNS browse agent, one container.
# The IS-04 registry agent that used to share this container is its own stack,
# PLUGIN.NMOS_CONTROL: the two share nothing in memory, only the bus table.
#     COMPOSE_PROFILES=discovery docker compose -f 'PODS/POD.THICK/PLUGINS/PLUGIN.NMOS/Docker/docker-compose.yml' up -d --build
# Normally started with the other plugins, by node role (see discovery):
#     COMPOSE_PROFILES=discovery,l2 docker compose -f 'PODS/POD.THICK/DISCOVERY.Engine/Docker/docker-compose.yml' up -d
# The image, the capability floor, the broker variables and the healthcheck are
# the base service in DISCOVERY.Engine/Docker/plugin-base.yml; this file says
# only what is THIS plugin's. No bind mounts, so no `bind:` sub-key to carry.

# ONE PROJECT WITH THE REST (`apk-audio`), so the plugins clump with the node.
name: apk-audio

# IN THE POD: the discovery engine's compose file must `include:` this one, and
# DockTor's K8/plugin-includes.sh fails when it does not (PLAN-3395.01).
x-apk-plugin: true

# The shared volumes (apk-audio-logs, mac-lookup-cache) are declared ONCE in
# DISCOVERY.Engine/Docker/plugin-volumes.yml (audit 2026-10-30, W02).
include:
  - path: "../../../DISCOVERY.Engine/Docker/plugin-volumes.yml"

services:
  nmos:
    extends:
      file: "../../../DISCOVERY.Engine/Docker/plugin-base.yml"
      service: plugin-host
    container_name: Plugin-NMOS
    # WHAT THIS IS, said by the container itself (PLAN-3409.01): DockTor reads
    # these with docker inspect, so its purpose and endpoint panes keep no list.
    labels:
      # HOW THE DISCOVERY ENGINE RAISES IT (ROAD-3437 step 3A): its launch table
      # is these two labels, equal to config.ini [nmos] raise/serves (check.sh raise-labels).
      audio.apk.raise: "on-sighting"
      audio.apk.serves: "nmos"
      audio.apk.purpose: "NMOS mDNS browse agent"
      audio.apk.purpose.what: "apk-nmos on host networking, finding NMOS APIs (registries, nodes) announced over mDNS and publishing them in the nmos bus table."
      audio.apk.purpose.why: "It answers where the NMOS registries and nodes on the LAN are. Its sibling Plugin-NMOS_CONTROL reads what is registered inside them; `role` separates their rows."
      audio.apk.endpoint.1: "open http://127.0.0.1:3212/x-nmos/node/v1.3/self NMOS Node API"
    command: ["apk-nmos"]
    profiles: [discovery]
